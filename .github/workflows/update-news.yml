name: Actualizar noticias deportivas

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar noticias desde RSS
        run: python scripts/update_news.py
      - name: Guardar noticias actualizadas
        run: |
          if [[ -n "$(git status --porcelain news.json)" ]]; then
            git config user.name "allsports-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add news.json
            git commit -m "Actualizar noticias deportivas"
            git push
          else
            echo "No hay noticias nuevas."
          fi
