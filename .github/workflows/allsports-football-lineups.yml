      - run: node bots/futbol-extra-bot.mjs seleccion-masculina
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}

  seleccion_femenina:
