      - run: node bots/futbol-extra-bot.mjs copa-del-rey
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}

  futbol_femenino:
